[project]
name = "jforest"
version = "0.1.0"
description = "숲나들e 자연휴양림 크롤러"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "click>=8.1",
]

[project.scripts]
jforest = "jforest.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
