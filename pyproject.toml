[project]
name = "jforest"
version = "0.1.0"
description = "숲나들e 자연휴양림 크롤러"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "click>=8.1",
    "olefile>=0.47",
    "google-cloud-vision>=3.14.0",
    "google-genai>=2.8.0",
    "openai>=2.0.0",
    "qdrant-client>=1.15.0",
    "sentence-transformers>=3.0.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[project.scripts]
jforest = "jforest.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # starlette TestClient import warns to switch to httpx2; external, not our code
    "ignore:Using `httpx` with `starlette.testclient`",
]
